name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            runner -> runner/target

      - run: npm ci

      - name: Frontend
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Backend
        run: npm run check:rust
