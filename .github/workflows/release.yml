name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # Nothing is built or published unless the tests pass on the tagged commit.
  check:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/version.mjs check "${{ github.ref_name }}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            runner -> runner/target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer and `latest.json`; the app refuses any update that is not signed with it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Discord Quest Completer v__VERSION__
          releaseDraft: true
          prerelease: false
