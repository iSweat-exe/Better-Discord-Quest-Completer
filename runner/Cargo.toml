[package]
name = "dqc-runner"
version = "2.1.1"
edition = "2024"
rust-version = "1.88"
description = "Placeholder game process used by Discord Quest Completer"
license = "MIT"
publish = false

# Deliberately outside the main workspace: it has its own profile (minimum
# size) and its own compiler flags (static CRT).
[workspace]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
