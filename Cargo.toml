[workspace]
resolver = "3"
members = ["src-tauri"]
# Le runner est compilé à part (profil « taille minimale », CRT statique) par
# le script de build de `src-tauri`, puis embarqué dans l'application.
exclude = ["runner"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Choix de style assumés : les commandes Tauri et les types de domaine
# gagnent en lisibilité avec ces libertés.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
# `assert!(x.is_empty())` reads better than the lint's suggestion.
assert_is_empty = "allow"
unused_async = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
